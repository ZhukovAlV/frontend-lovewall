version: '3.8'

services:
  # Frontend with Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lovewall-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_AUTH_SERVICE_URL=http://192.168.1.99:8080
      - VITE_API_USER_SERVICE_URL=http://192.168.1.99:8081
    networks:
      - lovewall-network
    volumes:
      - ./uploads:/var/www/uploads:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  lovewall-network:
    driver: bridge
